# =============================================================================
# Sample config for lab5-watcher (TOML format)
# Поддерживаются форматы: TOML (.toml), YAML (.yaml, .yml).
# Выбор парсера — по расширению файла. Если расширения нет → сначала TOML, потом YAML.
# =============================================================================

[thresholds]
# Количество zombie-процессов, при котором срабатывает порог
zombie_max = 10

# Максимальная загрузка CPU (%)
cpu_max = 90.0

# Минимальная загрузка CPU (%) — аномально низкая загрузка (возможный сбой сервисов)
cpu_min = 5.0

# Минимум свободной памяти в МБ
mem_free_min = 512

# Максимум занятого swap в МБ
swap_max = 8192

# Порог использования диска (%), общий для всех ФС
disk_used_percent = 60

# Порог скорости заполнения дисков (Кб блоки/замер) — сравнивается с разницей между снимками
disk_fill_speed = 1048576

[settings]
# Сколько последних замеров хранить в файле истории
retention_count = 5

# Отправить собранную статистику через wall (false = только алерты)
print_stats = true
